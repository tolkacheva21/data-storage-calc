<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Моделирование характеристик хранилища данных</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";

    const root = document.getElementById("root");
    const names = ["app.py", "model.py", "plots.py"];
    const files = {};

    try {
      for (const name of names) {
        const r = await fetch(name);
        if (!r.ok) throw new Error(`Файл ${name} не найден (HTTP ${r.status}): ${r.url}`);
        files[name] = await r.text();
      }
      mount(
        {
          requirements: ["numpy", "pandas", "matplotlib", "jinja2"],
          entrypoint: "app.py",
          files,
        },
        root
      );
    } catch (e) {
      root.innerHTML = `<pre style="color:#b00;padding:1rem">${e.message}</pre>`;
    }
  </script>
</body>
</html>
