<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Моделирование характеристик хранилища данных</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.85.1/build/stlite.css" />
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/mountable@0.85.1/build/stlite.js";

    const load = async (name) => (await fetch(name)).text();

    mount(
      {
        requirements: ["numpy", "pandas", "matplotlib", "jinja2"],
        entrypoint: "app.py",
        files: {
          "app.py":   await load("app.py"),
          "model.py": await load("model.py"),
          "plots.py": await load("plots.py"),
        },
      },
      document.getElementById("root")
    );
  </script>
</body>
</html>
